name: hl-fidelizacion

services:
  app:
    build:
      context: ./docker/php
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=hl-fidelizacion
    depends_on:
      - mysql
      - redis
    networks: [hl]

  queue:
    build:
      context: ./docker/php
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --sleep=1
    depends_on:
      - mysql
      - redis
    networks: [hl]

  scheduler:
    build:
      context: ./docker/php
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    depends_on:
      - mysql
      - redis
    networks: [hl]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [hl]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hl_fidelizacion
      MYSQL_USER: hl_fidelizacion
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [hl]

  redis:
    image: redis:7-alpine
    networks: [hl]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # smtp
    networks: [hl]

  # --- WordPress efímero, solo para desarrollar/probar el plugin SSO ---
  # (NO toca webadmin.harkerlloreda.com; es un sandbox local)
  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: mysql-wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: secret
    volumes:
      - wp_data:/var/www/html
      - ./wordpress-plugin/hl-puntos-sso-bridge:/var/www/html/wp-content/plugins/hl-puntos-sso-bridge
    depends_on:
      - mysql-wp
    networks: [hl]

  mysql-wp:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_wp_data:/var/lib/mysql
    networks: [hl]

networks:
  hl:

volumes:
  mysql_data:
  mysql_wp_data:
  wp_data:
