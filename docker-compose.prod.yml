name: hl-fidelizacion-prod

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.prod
    env_file: .env
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks: [hl]

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.prod
    env_file: .env
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --sleep=1 --max-time=3600
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks: [hl]

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.prod
    env_file: .env
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks: [hl]

  nginx:
    image: nginx:1.27-alpine
    # Asume un VPS propio sin otro servidor web por delante: Nginx escucha
    # directo en 80/443. Si el VPS llega con WHM/cPanel ya instalado y hay que
    # convivir con su Apache, usar en su lugar el puerto de loopback +
    # docker/apache-reverse-proxy.conf.example (ver docs/08-despliegue).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks: [hl]

  mysql:
    image: mysql:8.4
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks: [hl]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks: [hl]

networks:
  hl:

volumes:
  mysql_data:
  redis_data:
