# Escucha solo en localhost: el Apache de WHM/cPanel es quien recibe el
# tráfico público en 80/443 y lo reenvía aquí por reverse proxy (ver
# docker/apache-reverse-proxy.conf.example). Este contenedor nunca se expone
# directo a internet.
server {
    listen 80;
    server_name puntos.harkerlloreda.com;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # Apache antepone estas cabeceras al proxypasear; Laravel las usa para
    # generar URLs https correctas detrás del proxy.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
