# Asume un VPS propio donde Nginx es el único servidor web (ver nota en
# docker-compose.prod.yml si en cambio hay que convivir con el Apache de un
# WHM/cPanel preinstalado).
#
# TLS: requiere certificados ya emitidos en /etc/letsencrypt (ver
# docs/08-despliegue/04-guia-produccion.md, sección "TLS" — es un paso manual
# de una sola vez con certbot antes del primer `docker compose up`).

server {
    listen 80;
    server_name puntos.harkerlloreda.com;

    # Let's Encrypt valida el dominio pidiendo este archivo por HTTP plano.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name puntos.harkerlloreda.com;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/puntos.harkerlloreda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puntos.harkerlloreda.com/privkey.pem;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
