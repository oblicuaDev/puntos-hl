; Docker Desktop en Windows monta el proyecto por bind mount, y cada stat()
; de archivo cruza el puente Windows<->Linux. El default de PHP (revisar cada
; 2s) hace que opcache re-stat-ee miles de archivos de vendor/ en casi cada
; request. Subir el intervalo evita esa tormenta de stats sin desactivar la
; detección de cambios (siguen reflejándose, con hasta este margen).
opcache.validate_timestamps=1
opcache.revalidate_freq=60
